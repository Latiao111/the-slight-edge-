      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var q = params.get('theme');
          var stored = window.localStorage.getItem('slight_edge_theme_v1');
          var theme = q === 'light' || q === 'dark' ? q : (stored === 'light' || stored === 'dark' ? stored : 'dark');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
